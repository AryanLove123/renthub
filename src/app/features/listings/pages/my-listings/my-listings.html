<div class="my-listings-page">
    <div class="my-listings-header">
    <div>
      <h1>My Listings</h1>
      <p>Manage the properties you've listed on RentHub.</p>
    </div>
    <a mat-flat-button color="primary" routerLink="/landlord/listings/create">
      <mat-icon aria-hidden="true">add_home</mat-icon>
      Create Listing
    </a>
  </div>

    @if(myListings().length === 0){
    <app-empty-state icon="home_work" title="You haven't listed any properties yet"
        message="Create your first listing to start receiving inquiries from renters.">
        <a mat-flat-button color="primary" routerLink="/landlord/listings/create">Create Your First Listing</a>
    </app-empty-state>
    }
    @else{
    <div class="my-listings-grid">
        @for(property of myListings(); track property.id){
        <app-property-card 
        [property]="property"
        [showFavIcon]="false"
        [showLandlordActions]="true"
        (editRequested)="onEdit($event)"
        (deleteRequested)="onDelete($event)"
        ></app-property-card>
        }
    </div>
    }
</div>
